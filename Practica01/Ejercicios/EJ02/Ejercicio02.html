<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #332a9f;
        }

        form {
            background-color: white;
            padding: 25px;
            max-width: 400px;
            margin: 0 auto;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Registro de Cuenta</h1>
    <form action="/my-handling-form-page" method="post">
        <ul>
            <li>
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required minlength="4" maxlength="15"
                    placeholder="Entre 4 y 15 caracteres">
            </li>
            <li>
                <label for="email">Correo electronico:</label>
                <input type="email" id="email" name="email">
                <small class="error-hint">Introduce un correo válido.</small>
            </li>
            <li>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                placeholder="Mínimo 8 caracteres, una mayúscula y un número">
                <small class="error-hint">Minimo 8 caracteres, al menos una mayuscula, una minuscula y un numero.</small>
            </li>
            <li class="button">
                <button type="submit">Registrarse</button>
            </li>
        </ul>
    </form>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores HLS</title>
    <link rel="stylesheet" href="coloreshlss.css">
</head>
<body>
    <h1>Un atributo siempre debe tener lo siguiente</h1>

    <div class="hls1">
        <p>Un espacio entre éste y el nombre del elemento (o el atributo anterior, si el elemento ya
            tiene uno o más atributos).</p>
    </div>

    <div class="hls2">
        <p>El nombre del atributo seguido de un signo igual.</p>
    </div>

    <div class="hls3">
        <p>El valor del atributo envuelto por comillas de apertura y cierre.</p>
    </div>
</body>
</html>
